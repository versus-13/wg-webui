{{define "title"}}{{t "page.change_password"}}{{end}}

{{define "body"}}
<nav class="nav">
  <div class="nav-brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    WireGuard UI <span class="ver">{{version}}</span>
  </div>
  <div class="nav-links">
    <a href="/settings">{{t "nav.settings"}}</a>
    <a href="/status">{{t "nav.status"}}</a>
    <a href="/logout">{{t "nav.logout"}}</a>
  </div>
</nav>
<div class="container">
  {{range .Flashes}}
  <div class="alert alert-{{.Category}}">{{.Text}}</div>
  {{end}}

  <div class="card" style="max-width:480px;margin:0 auto;">
    <div class="card-header">
      <span class="card-title">{{t "section.change_pw"}}</span>
    </div>
    <form method="post" action="/change-password" style="padding:1.5rem;">
      <div class="form-group">
        <label>{{t "label.current_password"}}</label>
        <input type="password" name="old_password" autofocus autocomplete="current-password">
      </div>
      <div class="form-group">
        <label>{{t "label.new_password"}}</label>
        <input type="password" name="new_password" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>{{t "label.confirm"}}</label>
        <input type="password" name="confirm" autocomplete="new-password">
      </div>
      <div style="display:flex;gap:.75rem;justify-content:flex-end;">
        <a href="/" class="btn btn-ghost">{{t "btn.cancel"}}</a>
        <button type="submit" class="btn btn-primary">{{t "btn.save"}}</button>
      </div>
    </form>
  </div>
</div>
{{end}}
